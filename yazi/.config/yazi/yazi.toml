[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = false
linemode = "size"

[opener]
edit = [
    { run = "$EDITOR %s", block = true, for = "unix" },
]

play = [
    { run = "mpv %s", orphan = true, for = "unix" },
]

read = [
    { run = "zathura %s", orphan = true, for = "unix" },
]

image = [
    { run = "swayimg %s", orphan = true, for = "unix" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "application/pdf", use = "read" },
    { mime = "image/*", use = "image" },
]
